name: Dependabot Auto-Approve

# pull_request_target (not pull_request): GitHub gives Dependabot-triggered
# `pull_request` workflows a READ-ONLY token, so approve/auto-merge 403'd. With
# pull_request_target the job runs in the base-repo context with the permissions
# below, even for Dependabot PRs. Safe here: it never checks out or runs PR code,
# it only calls the GitHub API. The org ruleset requires 0 reviews, so no explicit
# approval is needed: just enable auto-merge, and CI gates the actual merge.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  # Read-only, for the merge-queue green probe below (po#7832): check runs and commit statuses on
  # the PR head. Without them the probe 403s, reads as "not green", and never arms.
  checks: read
  statuses: read
  # The semver-major hold labels the PR `dependabot-major`; GitHub creates a missing label from
  # addLabels only with issues: write, and without the label claude-config's merge shepherd reads a
  # group major (whose title names no versions) as ready and arms it (Signlo/iptorian#456 review).
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-approve:
    name: Auto-approve Dependabot PRs
    # HOSTED BY DEFAULT. This file is distributed to every repo in the org, so its runner must
    # be one every repo can reach: an unset variable is not 'self-hosted', so this resolves to the
    # GitHub-hosted runner everywhere. The allow-list is the repos whose CI may opt in; adding one
    # is a reviewed change here, never a variable set elsewhere. Keep both, and never opt in a
    # public repo. Rationale, measurements and history (kept in the private repo on purpose, this
    # file is published): docs/operations/dependabot-auto-approve-runner-2026-09-14.md.
    # Pinned by tests/test_workflow_dependabot_auto_approve.py.
    runs-on: ${{ vars.FLEET_RUNNER_MODE != 'hosted' && vars.DEPENDABOT_APPROVE_RUNNER == 'self-hosted' && contains('|Signlo/.github|Signlo/claude-config|Signlo/deaflare-app|Signlo/deaflare-web|Signlo/diplosint|Signlo/hearcompanion-app|Signlo/ideafe-web|Signlo/iptorian|Signlo/signlo-admin|Signlo/signlo-app|Signlo/signlo-brand|Signlo/signlo-codec|Signlo/signlo-platform-ops|Signlo/signlo-studio|Signlo/signlo-web|', format('|{0}|', github.repository)) && fromJSON('["self-hosted","fleet-x64"]') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 5
    # BOTH identities, never one (po#8993). The PR author alone would approve and arm commits
    # anyone with write access pushed onto a Dependabot branch; the event actor alone can be
    # Dependabot on a pull request someone else opened. Dependabot must have opened the pull
    # request AND caused this event.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'

    steps:
      # A SEMVER-MAJOR UPDATE NEVER RIDES AN AUTO-MERGED PR (Signlo/iptorian#456, 2026-10-19). A
      # Dependabot group PR carried 36 updates, one of them @sentry/nextjs 10 -> 11; this job armed
      # it once green, Vercel built it READY, and iptorian.ai answered 500 on every request for
      # 2 h 18 min. Build, types and tests do not start the production server, so green CI says nothing
      # about a major's runtime break. The PR title of a group names no versions, so the title
      # cannot tell either: the update type of EVERY dependency is read from Dependabot's own commit
      # metadata. A major anywhere in the PR, or metadata that cannot be read (fail closed), means:
      # no arming on any path below, an armed PR is disarmed, the PR is labelled `dependabot-major`
      # (claude-config bin/priority-pr-watch.py holds a PR carrying it) and gets one comment.
      # Pinned by tests/test_workflow_dependabot_auto_approve.py, which runs the script below.
      - name: Read every dependency's update type
        id: metadata
        continue-on-error: true
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Hold a semver-major update for a person or a lane
        id: major
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          UPDATED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const MAJOR = 'version-update:semver-major';
            let majors = [];
            let reason = '';
            if (process.env.METADATA_OUTCOME !== 'success') {
              reason = 'the Dependabot metadata could not be read (' + (process.env.METADATA_OUTCOME || 'no outcome') + ')';
            } else {
              let deps = null;
              try {
                deps = JSON.parse(process.env.UPDATED_DEPENDENCIES || '');
              } catch (e) {
                const detail = (e && e.message) || (e == null ? '' : String(e));
                core.warning('updated-dependencies-json: ' + (detail || '<empty>'));
              }
              if (!Array.isArray(deps) || deps.length === 0) {
                reason = 'the Dependabot metadata lists no dependency';
              } else {
                majors = deps.filter((d) => d && d.updateType === MAJOR).map((d) => String(d.dependencyName));
                if (majors.length === 0 && process.env.UPDATE_TYPE === MAJOR) majors = ['(named in update-type)'];
                if (majors.length) reason = 'semver-major: ' + majors.join(', ');
              }
            }
            const pr = context.payload.pull_request;
            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number };
            const LABEL = 'dependabot-major';
            const labelled = (pr.labels || []).some((l) => l && l.name === LABEL);
            if (!reason) {
              core.setOutput('hold', 'false');
              core.info('no semver-major update in this PR: arming continues');
              // A hold from an earlier push (or a passing metadata glitch) is lifted once the PR
              // carries no major, or the shepherd would keep it on needs-operator forever.
              if (labelled) {
                try {
                  await github.rest.issues.removeLabel({ ...issue, name: LABEL });
                } catch (e) {
                  const detail = (e && e.message) || (e == null ? '' : String(e));
                  core.warning('removeLabel dependabot-major: ' + (detail || '<empty>'));
                }
              }
              return;
            }
            core.setOutput('hold', 'true');
            core.notice('not arming: ' + reason);
            if (pr.auto_merge) {
              try {
                await github.graphql(`
                  mutation DisableAutoMerge($pullRequestId: ID!) {
                    disablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId }) { clientMutationId }
                  }
                `, { pullRequestId: pr.node_id });
                core.notice('disarmed the auto-merge this PR already carried');
              } catch (e) {
                const detail = (e && e.message) || (e == null ? '' : String(e));
                core.warning('disablePullRequestAutoMerge: ' + (detail || '<empty>'));
              }
            }
            // The label is what holds the PR on the shepherd's side too, so a failure to set it is
            // a red run, not a warning (after the comment below is still attempted).
            let labelError = '';
            try {
              await github.rest.issues.addLabels({ ...issue, labels: [LABEL] });
            } catch (e) {
              const detail = (e && e.message) || (e == null ? '' : String(e));
              labelError = 'addLabels dependabot-major: ' + (detail || '<empty>');
              core.warning(labelError);
            }
            const marker = '<!-- dependabot-major-hold -->';
            try {
              const comments = await github.paginate(github.rest.issues.listComments, { ...issue, per_page: 100 });
              if (!comments.some((c) => String(c.body || '').includes(marker))) {
                await github.rest.issues.createComment({ ...issue, body: marker + 'Not auto-merged (' + reason + '): a human or a lane must test it on a preview deployment before it merges.' });
              }
            } catch (e) {
              const detail = (e && e.message) || (e == null ? '' : String(e));
              core.warning('hold comment: ' + (detail || '<empty>'));
            }
            if (labelError) core.setFailed(labelError);

      - name: Enable auto-merge
        id: arm
        if: steps.major.outputs.hold == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // A REPO WHOSE MERGES ANOTHER AUTHORITY OWNS IS NEVER ARMED HERE (merge-bot trial,
            // DECISION-0126). For the trial Mergify is the ONLY arming authority on a repo that
            // carries `.mergify.yml` on its default branch, and its native merge-queue rule is
            // removed, so an arming here would be a second authority and, with no queue, a direct
            // squash. This job runs in Actions with no claude-config checkout, so the repo's own
            // `.mergify.yml` is the switch: present, the PR is labelled merge/arm-when-green (how a
            // PR is handed to Mergify) and nothing is armed; absent (404), arming continues below
            // exactly as before; any other answer arms nothing and fails this step, because we
            // cannot tell whether a second authority is live.
            // Pinned by tests/test_workflow_dependabot_auto_approve.py, which runs this script.
            const HAND_OFF_LABEL = 'merge/arm-when-green';
            const defaultBranch = (context.payload.repository && context.payload.repository.default_branch) ||
              (context.payload.pull_request.base.repo && context.payload.pull_request.base.repo.default_branch) || '';
            let otherAuthority = 'unread';
            let switchError = '';
            if (!defaultBranch) {
              switchError = 'the default branch is not in the event payload';
            } else {
              // Every path Mergify reads its config from (review of the switch PR): any one present is
              // the switch; all three absent (404) is "none"; any other error arms nothing.
              otherAuthority = 'none';
              for (const path of ['.mergify.yml', '.mergify/config.yml', '.github/mergify.yml']) {
                try {
                  await github.rest.repos.getContent({
                    owner: context.repo.owner, repo: context.repo.repo, path, ref: defaultBranch,
                  });
                  otherAuthority = 'mergify';
                  break;
                } catch (e) {
                  if (!(e && e.status === 404)) {
                    const detail = (e && e.message) || (e == null ? '' : String(e));
                    switchError = 'reading ' + path + ': ' + (detail || '<empty>');
                    otherAuthority = 'unread';
                    break;
                  }
                }
              }
            }
            // No `queue` or `green` output on this path: unset, they never read 'true', so the
            // methodless arming step below cannot run after a hand-off either.
            if (otherAuthority !== 'none') {
              if (switchError) {
                core.setOutput('handoff', 'unread');
                core.setFailed('not arming: the merge-arming switch could not be read (' + switchError + '); nothing is armed this run');
                return;
              }
              core.setOutput('handoff', otherAuthority);
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number, labels: [HAND_OFF_LABEL],
                });
                core.notice('not arming: this repo carries .mergify.yml, so Mergify owns its merges; labelled ' + HAND_OFF_LABEL);
              } catch (e) {
                const detail = (e && e.message) || (e == null ? '' : String(e));
                core.setFailed('not arming (Mergify owns this repo), and the hand-off label failed: ' + (detail || '<empty>'));
              }
              return;
            }
            core.setOutput('handoff', 'none');
            // WHY THE METHOD IS CONDITIONAL FROM HERE DOWN (po#6580, measured 2026-09-18/19).
            // On a base branch whose ruleset carries a MERGE_QUEUE rule the queue OWNS the merge
            // strategy. An arming that NAMES a method is accepted, records an autoMergeRequest,
            // and is then never enqueued: the pull request sits CLEAN and armed for ever with
            // every check green and nothing anywhere saying it is stuck. Naming the queue's OWN
            // method does not help, which is the part that misleads: signlo-app's queue is
            // configured SQUASH and this file armed SQUASH. Four signlo-app Dependabot PRs show
            // the same shape and #2154 is the controlled pair on a single PR: armed by this
            // workflow at 2026-08-31T05:15:40Z and never enqueued, disarmed at 06:25:45Z,
            // re-armed with NO method at 2026-09-01T00:02:52Z and added_to_merge_queue at
            // 00:12:09Z. #2417 and #2419 each sat two days this way, and #2419 is why the
            // org's security bumps stopped landing.
            //
            // The method cannot simply be deleted from the mutation below. GraphQL's
            // enablePullRequestAutoMerge declares `mergeMethod` with a DEFAULT of MERGE
            // (`gh api graphql` introspection of EnablePullRequestAutoMergeInput), so an omitted
            // field still arrives as a named method and stalls identically. Only a caller that
            // never sends the field enqueues, which is what `gh pr merge --auto` does and what
            // scripts/agents/lib/merge.mjs has used for queue repos since 2026-08-02. So the
            // queue case is handed to that same command in the next step.
            //
            // The branch is ASKED, never hardcoded: 2 of the 16 repos this file is synced to have
            // a queue today (signlo-app, diplosint), and a repo that enables one later has to be
            // right without a second edit to a file it does not own.
            let hasQueue = false;
            try {
              const probe = await github.graphql(`
                query MergeQueueOnBase($owner: String!, $name: String!, $branch: String!) {
                  repository(owner: $owner, name: $name) { mergeQueue(branch: $branch) { id } }
                }
              `, {
                owner: context.repo.owner,
                name: context.repo.repo,
                branch: context.payload.pull_request.base.ref,
              });
              hasQueue = !!(probe && probe.repository && probe.repository.mergeQueue && probe.repository.mergeQueue.id);
            } catch (e) {
              // Fail toward the STATUS QUO, which is naming SQUASH below. That is correct for the
              // 14 synced repos with no queue, and a probe error must never silently hand one of
              // them the MERGE default. A queue repo that lands here stalls exactly as it does
              // today, and stalled_merge_intent.py reports it within 30 minutes.
              const detail = (e && e.message) || (e == null ? '' : String(e));
              core.warning('mergeQueue probe: ' + (detail || '<empty>'));
            }
            core.setOutput('queue', hasQueue ? 'true' : 'false');
            if (hasQueue) {
              // po#7832: "no method" is safe only once the PR is GREEN. `gh pr merge --auto` run
              // while checks are still pending records `mergeMethod: MERGE` and stalls exactly like
              // a named method (signlo-app#2647, 2026-10-09T03:52Z): gh enqueues directly only when
              // the PR is already mergeable. This job runs seconds after Dependabot pushes, so the
              // usual answer here is "not green yet", and then nothing is armed: claude-config
              // bin/priority-pr-watch.py (on signlo-hetzner1, every ten minutes, through
              // bin/lib/pr_states.py) enqueues it with no method once CI is green and never arms a
              // PR labelled dependabot-major. platform-ops' own merge-ready sweep has not been
              // scheduled since 2026-10-15 (DECISION-0087), and its chokepoint refuses that label too
              // (po#9441).
              // This job's own check run is still in progress, so it is excluded by name.
              // Any probe error reads as NOT green: the cost is a ten-minute wait for the rail,
              // the alternative is a stall.
              let green = false;
              try {
                const sha = context.payload.pull_request.head.sha;
                const runs = await github.paginate(github.rest.checks.listForRef, {
                  owner: context.repo.owner, repo: context.repo.repo, ref: sha, per_page: 100,
                });
                const others = runs.filter((r) => r.name !== 'Auto-approve Dependabot PRs');
                const ok = new Set(['success', 'neutral', 'skipped']);
                const status = await github.rest.repos.getCombinedStatusForRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: sha,
                });
                const statusOk = status.data.total_count === 0 || status.data.state === 'success';
                // A job gated on `needs:` has no check run until its prerequisite finishes, so
                // "every run so far is green" can hold while required checks do not exist yet.
                // `clean` is GitHub's own answer that the REQUIRED checks have passed.
                const fresh = await github.rest.pulls.get({
                  owner: context.repo.owner, repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                });
                green = others.length > 0 && statusOk && fresh.data.mergeable_state === 'clean' &&
                  others.every((r) => r.status === 'completed' && ok.has(r.conclusion));
              } catch (e) {
                const detail = (e && e.message) || (e == null ? '' : String(e));
                core.warning('check-run probe: ' + (detail || '<empty>'));
              }
              core.setOutput('green', green ? 'true' : 'false');
              if (green) {
                core.info('merge-queue base and CI green: arming with no method in the next step');
              } else {
                core.notice('merge-queue base and CI not green yet: not arming (it would record MERGE and stall); claude-config priority-pr-watch enqueues it once green');
              }
              return;
            }
            // NO BRANCH UPDATE ON ANY PATH (po#8642, 2026-10-16). Until then the queue-less path
            // called pulls.updateBranch, which runs under GITHUB_TOKEN, so the merge-from-main commit
            // it wrote was AUTHORED BY github-actions[bot]: GitHub's squash credits that author with a
            // Co-authored-by line on main, scripts/check_squash_trailer.py refuses it (po#7463), and
            // po#8273, #8274 and #8277 went red on exactly such commits (2026-10-13: CI ran on the
            // update's head and failed Static Checks). It bought nothing either: no queue-less repo
            // enforces an up-to-date branch (measured 2026-10-16, `rules/branches/main` strict is false
            // on all 13; claude-config's legacy strict flag is inert, its required status checks are
            // off), so an armed SQUASH merges a BEHIND branch anyway. A Dependabot branch carrying a
            // foreign merge commit is also one Dependabot refuses to rebase.
            // Pinned by tests/test_workflow_dependabot_auto_approve.py.
            await github.graphql(`
              mutation EnableAutoMerge($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) { pullRequest { autoMergeRequest { mergeMethod } } }
              }
            `, { pullRequestId: context.payload.pull_request.node_id }).catch((e) => {
              core.warning('enablePullRequestAutoMerge: ' + e.message);
            });

      - name: Arm auto-merge on a merge-queue branch (no method, the queue owns the strategy)
        if: steps.major.outputs.hold == 'false' && steps.arm.outputs.queue == 'true' && steps.arm.outputs.green == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit repository targeting. `gh` resolves the repository from the URL argument
          # below, so this is not what makes the call work; it is what makes the step pass the
          # class gate that two synced repos run on every workflow ("every `gh` step carries
          # GH_REPO or --repo, or the alert dies on a failed checkout": diplosint
          # tests/unit/workflow-alert-conditions.test.ts). Without it, the 2026-09-21 sync
          # (diplosint#1706) was red on exactly this step and never landed; this file is
          # distributed verbatim, so the fix belongs here, not in the receiving repo.
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -uo pipefail
          # Deliberately NOT `set -e`, and the failure is a warning rather than a red job. The org
          # auto-merge rail's `ciChecksGreen` is name-agnostic, so any failing check-run on this PR
          # parks it: failing here would trade a silent stall for a louder one on the same PR. The
          # visibility this state needs is scripts/monitoring/stalled_merge_intent.py, the STILL
          # rail check written for exactly it (po#6580 scope point 2), which reports a CLEAN and
          # armed PR that is absent from its queue within 30 minutes.
          if gh pr merge "$PR_URL" --auto; then
            echo "armed: native auto-merge with no method, the queue lands it"
          else
            echo "::warning::gh pr merge --auto failed; stalled-merge-intent reports it if it sticks"
          fi
