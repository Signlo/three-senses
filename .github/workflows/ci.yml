# The repo's proof: build the SDK, run its tests (which include the
# conformance vectors and their negative controls), and fail if the built
# output or embedded data drifts from the committed artifacts.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Committed dist matches the source (no stale build)
        run: git diff --exit-code -- dist src/data.ts
      - name: The CLI proves conformance
        run: node dist/cli.js conformance
