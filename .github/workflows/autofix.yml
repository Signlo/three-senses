name: 🔧 Autofix Code Formatting
# v7 - Signlo Organization Multi-Language Auto-Formatting System
# This workflow is distributed to all Signlo repositories via sync_autofix.py
# Note: For .github/ directory lint fixes (YAML trailing spaces, JS quote style),
# see code-quality.yml which handles these via PR-based remediation.

on:
  pull_request:
    paths:
      - '**.py'
      - '**.go'
      - '**.js'
      - '**.ts'
      - '**.yaml'
      - '**.yml'
      - '**.json'
  # NO `push: main` TRIGGER (2026-10-22, filler-fleet-20261022-3). The org ruleset
  # `signlo-protection-all-repos-main` puts a `pull_request` rule on every default branch with no
  # bypass actor, so the push job's `git push origin HEAD:main` is refused with GH013 every time
  # (claude-config run 39707995900: "push declined due to repository rule violations"), and its
  # `continue-on-error: true` turned that into a green run that pushed nothing. Measured over the 7
  # days to 2026-10-22: 1,476 push-to-main runs across the 15 repos carrying it (about 210 a day, each a
  # formatting job on a fleet runner or a hosted image), not one able to land, and 34 of them red
  # (the copies older than po#9522 refuse a moved main with exit 1, which pages
  # `main-build-failure`; config/incident-classes.yaml has four in one morning). Main is formatted by the PRs
  # that reach it. The Prettier, pre-commit and push-diagnostics steps below still read
  # `event_name == 'push'`, so they are inert until a later change decides whether they belong on
  # pull requests.
  # tests/test_workflow_autofix.py::TestNoPushToMainTrigger pins this.
  workflow_dispatch:  # Manual execution with configurable options
    inputs:
      ref:
        description: 'Branch, tag, or SHA to run autofix on (leave empty for current branch)'
        required: false
        type: string
      dry_run:
        description: 'Preview changes without committing'
        required: false
        type: boolean
        default: false

# READ-ONLY BY DEFAULT (2026-10-12, po#8208, org audit SA1 second vector). Each job widens
# only what it needs: `autofix` adds `pull-requests: write` for its PR comment, and `push`
# writes through the App token it mints itself, so neither ever holds `contents: write` on
# the GITHUB_TOKEN. See the `push` job's header for why the token lives in a second job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    # CONFIGURABLE RUNNER, SECURE DEFAULT (2026-08-19, Actions-minutes reduction).
    #
    # This was an unconditional `ubuntu-24.04-arm` while its four siblings
    # (autofix-on-failure, issue-auto-triage, agentic-pr-rescue, conflict-labeler,
    # dependabot-auto-approve) all run free on the self-hosted runner, and it fires on
    # `pull_request` in EVERY repo, so it was the single largest billed line in the
    # automation family.
    #
    # It cannot simply follow the siblings, because this file is synced to every repo
    # in the org by scripts/sync_autofix.py, including Signlo/three-senses, which is
    # PUBLIC. On a public repo a `pull_request` from a fork supplies both this file and
    # the code the steps run, and the steps below execute `pre-commit run --all-files`
    # whose hooks come from the PR's own .pre-commit-config.yaml. That is arbitrary
    # code execution; on signlo-hetzner1 it would be RCE on the box that carries the
    # Claude seats, the build host, master's DR standby and the four CI runner slots.
    # (This paragraph named minuit until 2026-09-14. That box was terminated 2026-09-11
    # and the argument transferred to its successor unchanged, which is the point: the
    # risk belongs to "our metal", not to one machine.)
    #
    # So the runner is a variable, and THE ABSENCE OF CONFIGURATION IS THE SAFE STATE:
    # unset `vars.AUTOFIX_RUNNER` interpolates as the empty string, which is not
    # 'self-hosted', so the `&&` yields false and the `||` falls through to the hosted
    # image. A brand-new repo, public or private, costs money and cannot leak. Only
    # an exact, explicit opt-in moves the job onto our metal.
    #
    # Note this is the INVERSE of the sibling idiom
    # (`inputs.use_hosted == true && 'ubuntu-24.04-arm' || fromJSON(self-hosted)`),
    # whose unconfigured default is self-hosted. That is fine in a workflow that is
    # never distributed to a public repo, and wrong here. `vars.` rather than `inputs.`
    # because this workflow's hot path is `pull_request`, which has no inputs at all.
    #
    # Deliberately NOT `github.repository == 'Signlo/three-senses'`: a hardcoded repo
    # name stops protecting anything the day a second public repo appears, and fails
    # toward exposure. The recommended way to set the variable is an ORG-level variable
    # with visibility "Private repositories", which makes GitHub itself enforce the
    # invariant: a public repo cannot read it, and a private repo that is later
    # flipped public LOSES access and falls back to hosted automatically.
    # scripts/check_public_runner_exposure.py enforces this shape in CI.
    # LABEL CORRECTED 2026-09-14: `minuit-micro` -> `hetzner1`. signlo-minuit was terminated
    # 2026-09-11 and no live runner carries that label (`gh api orgs/Signlo/actions/runners`
    # returns hetzner1, hetzner-x64, ci-vm/docker, mac-light, android). So the self-hosted branch
    # of this toggle pointed at nothing: flipping AUTOFIX_RUNNER to `self-hosted`, the documented
    # fallback lever above, would have QUEUED every autofix job forever, in this repo and in the
    # fifteen repos this file is synced to. Dormant today only because the org variable reads
    # `hosted`, which is exactly why nobody noticed. Its two siblings,
    # `autofix-on-failure.yml` and `alert-issue-reaper.yml`, were re-homed to `hetzner1` on
    # 2026-09-01 and this one was missed in the same sweep.
    # FLEET BY DEFAULT FOR PRIVATE REPOS, HOSTED AS THE FALLBACK (DECISION-0060, operator
    # 2026-09-16: "move all on hetzner except 3sense and use free github as fallback").
    #
    # THE POLARITY IS UNCHANGED AND MUST STAY THIS WAY: an UNSET variable still resolves to the
    # GitHub-hosted runner, so this file is safe the moment it lands in any repo, including a
    # public one, and `scripts/check_public_runner_exposure.py` (which evaluates every runs-on in
    # the unconfigured environment) still passes. Turning the fleet on is one org variable.
    #
    # THE ALLOW-LIST IS THE SECOND, INDEPENDENT GATE, and it is an allow-list rather than a
    # deny-list on purpose: a deny-list fails OPEN, so a repo created tomorrow would get fleet
    # access by default, and a public repo created tomorrow would get it while nobody was looking.
    # Signlo/three-senses is the only public repo and is deliberately absent. Adding a name here
    # is a reviewed change in this file; it can never be done by setting a variable elsewhere.
    #
    # Pinned by tests/test_fleet_runner_allowlist.py, which holds all three copies identical and
    # asserts no public repo is ever listed.
    runs-on: ${{ vars.FLEET_RUNNER_MODE != 'hosted' && vars.AUTOFIX_RUNNER == 'self-hosted' && contains('|Signlo/.github|Signlo/claude-config|Signlo/deaflare-app|Signlo/deaflare-web|Signlo/diplosint|Signlo/hearcompanion-app|Signlo/ideafe-web|Signlo/iptorian|Signlo/signlo-admin|Signlo/signlo-app|Signlo/signlo-brand|Signlo/signlo-codec|Signlo/signlo-platform-ops|Signlo/signlo-studio|Signlo/signlo-web|', format('|{0}|', github.repository)) && fromJSON('["self-hosted","fleet-x64"]') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 15

    # A DEPENDABOT PR SKIPS THIS JOB, IT DOES NOT FAIL IT (2026-08-31, signlo-app#2154/#2155).
    #
    # A Dependabot-triggered run (`pull_request`, `pull_request_target`, or a `push` whose
    # pusher is Dependabot) is handed GitHub's SEPARATE "Dependabot secrets" scope, not the
    # repo/org ACTIONS secrets. `secrets.SIGNLO_BOT_APP_ID` / `SIGNLO_BOT_PRIVATE_KEY`
    # therefore interpolate to the EMPTY STRING, and the very first step below, "Mint GitHub
    # App token", hard-fails on every single Dependabot PR:
    #
    #   The 'client-id' (or deprecated 'app-id') input must be set to a non-empty string.
    #   If using a secret or variable, ensure it is available in this workflow context.
    #
    # It is a SCOPE problem, not a missing secret: `gh api repos/Signlo/signlo-app/dependabot/secrets`
    # returns exactly two entries (MAESTRO_QA_EMAIL, MAESTRO_QA_PASSWORD) while the App
    # credentials exist only in the Actions scope. Re-running never helps: a re-run inherits
    # the same restricted scope, so this was an unfixable red check on every dependency PR in
    # every repo this template reaches.
    #
    # A clean SKIP is the correct behaviour, not a softened failure, because there is nothing
    # for this job to do even if it could start. GitHub also downgrades a Dependabot run's
    # GITHUB_TOKEN to READ-ONLY, so the formatting commit could not be pushed by any token
    # available here, and that is the same restriction that forced dependabot-auto-approve.yml
    # onto `pull_request_target`. And Dependabot only ever edits manifests/lockfiles, which
    # none of the formatters below rewrite. A job that CANNOT succeed must not report failure:
    # a red check nobody can act on trains reviewers to ignore red.
    #
    # Job-LEVEL `if:` on purpose, not a per-step guard on the mint: a job skipped at job level
    # reports conclusion `skipped`, which GitHub counts as satisfied for a required status
    # check, whereas a job that starts and fails inside blocks a merge. (Autofix is not a
    # required check anywhere today, and it also could not be, since its `pull_request` trigger is
    # `paths:`-filtered and a path-filtered required check sits "expected" forever on unrelated
    # PRs, but the job-level form is the shape that stays safe if a repo ever requires it.)
    #
    # `github.actor` is set by GitHub and a PR author cannot forge it: the same idiom,
    # inverted, that dependabot-auto-approve.yml uses and that
    # scripts/check_public_runner_exposure.py accepts in UNFORGEABLE_IDENTITY. It remains
    # `dependabot[bot]` across re-runs, which is exactly right here.
    #
    # Deliberately NOT `!endsWith(github.actor, '[bot]')`: the org's own bot opens real PRs
    # (roadmap driver, template sync) which run with the normal Actions scope and SHOULD be
    # autofixed. Widening this to every bot would silently switch autofix off for much of the
    # traffic that actually needs it. Both edges are pinned in
    # tests/test_workflow_autofix.py::TestDependabotSkip.
    #
    # THE SECOND CLAUSE IS A PER-REPO KILL SWITCH (repo variable AUTOFIX_FORMAT=off), added
    # 2026-09-07 after this workflow's first successful run on signlo-studio reformatted 146
    # files and pushed a commit main COULD NOT BUILD: that repo's bundler (tools/build.mjs)
    # deliberately parses a restricted module syntax, and prettier reflowed `import {` across
    # lines. A formatter and a parser-owned tree cannot both own the same bytes, which is the
    # same class as every generator-owned entry in .github/.prettierignore, except that it
    # covers ALL the formatters this job runs, not just prettier, and a whole repo rather than
    # a path (this file and the ignore file are both SYNCED VERBATIM org-wide, so a repo-local
    # edit to either survives exactly until the next sync; a repo VARIABLE is per-repo state
    # the sync never touches). Unset interpolates as the empty string, so the default is ON
    # everywhere: only an explicit `off` skips, and a skipped job reports `skipped`, which
    # GitHub counts as satisfied if this is ever required. Both edges are pinned in
    # tests/test_workflow_autofix.py::TestFormatKillSwitch.
    if: github.actor != 'dependabot[bot]' && vars.AUTOFIX_FORMAT != 'off'

    # This job runs the PR's own tree (prettier and eslint load a JS config from the repo root,
    # ruff, cargo, go and pre-commit read repo config too), so it holds NO write token: the
    # GITHUB_TOKEN reads contents and may comment on the PR, and nothing else. Its only output
    # toward a push is a patch artefact, which the `push` job validates as untrusted data.
    permissions:
      contents: read
      pull-requests: write
    outputs:
      has_patch: ${{ steps.export_patch.outputs.has_patch }}
      base_sha: ${{ steps.export_patch.outputs.base_sha }}

    steps:
      # No App token in this job, and none persisted (po#8208). Until 2026-10-12 this step
      # checked out with a `contents: write` App token and `persist-credentials: true`, so every
      # tool below ran with a token in .git/config that could push to any unprotected branch of
      # the repo, other open PR branches included. A PR adding `prettier.config.js` was enough.
      # The default GITHUB_TOKEN here is read-only for contents (job `permissions:` above) and
      # `persist-credentials: false` keeps even that out of .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.head_ref || github.sha }}
          persist-credentials: false

      # Initialize diagnostic tracking system for Signlo reporting
      - name: Initialize Signlo diagnostic system
        run: |
          mkdir -p /tmp/signlo_diagnostics
          echo "0" > /tmp/signlo_diagnostics/tool_count.txt
          # `: >` truncates to ZERO bytes. This was `echo "" >`, which writes a 1-byte newline,
          # and every consumer tests it with `[ -s … ]`, which is TRUE for 1 byte. So a perfectly
          # clean repo reported ".github Directory Issues Found" on every PR and every push, and
          # the "✅ No issues detected" branch was structurally UNREACHABLE. Mode C: the failure
          # path firing on the good case (docs/operations/mode-cd-audit-2026-08-19.md).
          : > /tmp/signlo_diagnostics/github_dir_issues.txt
          echo "Signlo Autofix Diagnostic System Initialized" > /tmp/signlo_diagnostics/session.log

      # ===================================================================
      # PYTHON ECOSYSTEM - Ruff Analysis & Formatting
      # ===================================================================
      - name: Detect Python codebase
        id: detect_python
        run: |
          if find . -name "*.py" -not -path "./.git/*" -not -path "./.github/*" | head -1 | grep -q .; then
            echo "detected=yes" >> "$GITHUB_OUTPUT"
            echo "Python files detected in repository" | tee -a /tmp/signlo_diagnostics/session.log
          else
            echo "detected=no" >> "$GITHUB_OUTPUT"
            echo "No Python files found - skipping Python toolchain" | tee -a /tmp/signlo_diagnostics/session.log
          fi

      - name: Setup Python runtime environment
        if: steps.detect_python.outputs.detected == 'yes'
        id: setup_py_runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          # No pip cache: this workflow is synced to every Signlo repo and Ruff
          # is installed from a pinned version below (not from a manifest). Keying
          # a pip cache on **/pyproject.toml etc. hard-fails setup-python on repos
          # that have .py files but no dependency manifest (e.g. claude-config).

      - name: Install Ruff linter/formatter
        if: steps.detect_python.outputs.detected == 'yes'
        id: install_ruff
        run: |
          pip install ruff==0.15.12
          echo "status=ok" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Execute Ruff on codebase (excluding .github)
        if: steps.detect_python.outputs.detected == 'yes' && steps.install_ruff.outputs.status == 'ok'
        run: |
          echo "Running Ruff linter with auto-fix..." | tee -a /tmp/signlo_diagnostics/session.log
          # `--extend-exclude`, never `--exclude`: a CLI `--exclude` REPLACES the repo's own
          # `[tool.ruff] exclude` (and ruff's defaults), so the old form reformatted the
          # byte-for-byte copies of hetzner1 files that PR #9222 excludes, and pushed that.
          ruff check --fix --exit-zero --extend-exclude ".github" . || echo "Ruff check encountered issues"
          ruff format --extend-exclude ".github" . || echo "Ruff format encountered issues"
          COUNT=$(($(cat /tmp/signlo_diagnostics/tool_count.txt 2>/dev/null || echo 0) + 1))
          echo "$COUNT" > /tmp/signlo_diagnostics/tool_count.txt
        continue-on-error: true

      - name: Scan .github directory for Python issues (read-only)
        if: steps.detect_python.outputs.detected == 'yes' && steps.install_ruff.outputs.status == 'ok'
        run: |
          # Record a section ONLY when ruff actually reports something. The old form appended the
          # header BEFORE running ruff and then appended ruff's own output unconditionally, and a
          # clean `ruff check` prints "All checks passed!", so the issues file was non-empty on a
          # clean repo twice over. Gate on ruff's OWN verdict (exit 0 = clean, 1 = violations),
          # and name the rc so a ruff CRASH (rc 2) is not filed as if it were a lint finding.
          RUFF_OUT="$(mktemp)"
          if ruff check .github/ --output-format=full > "$RUFF_OUT" 2>&1; then
            echo "ruff: .github/ is clean" >> /tmp/signlo_diagnostics/session.log
          else
            RUFF_RC=$?
            {
              echo "=== Python Issues in .github Directory (ruff rc=$RUFF_RC) ==="
              cat "$RUFF_OUT"
              echo ""
            } >> /tmp/signlo_diagnostics/github_dir_issues.txt
          fi
          rm -f "$RUFF_OUT"
        continue-on-error: true

      # ===================================================================
      # JAVASCRIPT/TYPESCRIPT ECOSYSTEM - Prettier Formatting
      # ===================================================================
      - name: Detect Prettier-formattable files
        id: detect_js_ts
        run: |
          if find . \( -name "*.js" -o -name "*.ts" -o -name "*.jsx" -o -name "*.tsx" \
            -o -name "*.json" -o -name "*.md" -o -name "*.yml" -o -name "*.yaml" \
            -o -name "*.html" -o -name "*.css" \) \
            -not -path "./.git/*" -not -path "./.github/*" -not -path "./node_modules/*" | head -1 | grep -q .; then
            echo "detected=yes" >> "$GITHUB_OUTPUT"
            echo "Prettier-formattable files detected" | tee -a /tmp/signlo_diagnostics/session.log
          else
            echo "detected=no" >> "$GITHUB_OUTPUT"
            echo "No Prettier-formattable files found - skipping Node toolchain" | tee -a /tmp/signlo_diagnostics/session.log
          fi

      - name: Setup Node.js runtime environment
        if: steps.detect_js_ts.outputs.detected == 'yes'
        id: setup_node_runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Cache global npm directory for Prettier
        if: steps.detect_js_ts.outputs.detected == 'yes'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-prettier-3.4.2
          restore-keys: |
            ${{ runner.os }}-npm-prettier-

      - name: Install Prettier formatter
        if: steps.detect_js_ts.outputs.detected == 'yes'
        id: install_prettier
        run: |
          npm install -g prettier@3.4.2
          echo "status=ok" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Execute Prettier with .prettierignore respect
        if: steps.detect_js_ts.outputs.detected == 'yes' && steps.install_prettier.outputs.status == 'ok' && github.event_name == 'push'
        run: |
          echo "Running Prettier (respecting .prettierignore)..." | tee -a /tmp/signlo_diagnostics/session.log
          prettier --write . --ignore-path .prettierignore --log-level warn || echo "Prettier encountered issues"
          COUNT=$(($(cat /tmp/signlo_diagnostics/tool_count.txt 2>/dev/null || echo 0) + 1))
          echo "$COUNT" > /tmp/signlo_diagnostics/tool_count.txt
        continue-on-error: true

      - name: Scan .github directory for Prettier issues (read-only)
        if: steps.detect_js_ts.outputs.detected == 'yes' && steps.install_prettier.outputs.status == 'ok'
        run: |
          # Same fix as the ruff scan above: gate on prettier's own verdict (exit 0 = every matched
          # file is already formatted) instead of appending a header before it even runs.
          PRETTIER_OUT="$(mktemp)"
          if prettier --check .github/ --log-level warn > "$PRETTIER_OUT" 2>&1; then
            echo "prettier: .github/ is clean" >> /tmp/signlo_diagnostics/session.log
          else
            PRETTIER_RC=$?
            {
              echo "=== Prettier Issues in .github Directory (prettier rc=$PRETTIER_RC) ==="
              cat "$PRETTIER_OUT"
              echo ""
            } >> /tmp/signlo_diagnostics/github_dir_issues.txt
          fi
          rm -f "$PRETTIER_OUT"
        continue-on-error: true

      # ===================================================================
      # RUST ECOSYSTEM - cargo fmt & clippy
      # ===================================================================
      - name: Detect Rust codebase
        id: detect_rust
        run: |
          if [ -f "Cargo.toml" ] || find . -name "*.rs" -not -path "./.git/*" -not -path "./.github/*" | head -1 | grep -q .; then
            echo "detected=yes" >> "$GITHUB_OUTPUT"
            echo "Rust files detected in repository" | tee -a /tmp/signlo_diagnostics/session.log
          else
            echo "detected=no" >> "$GITHUB_OUTPUT"
            echo "No Rust files found - skipping Rust toolchain" | tee -a /tmp/signlo_diagnostics/session.log
          fi

      - name: Setup Rust toolchain with caching
        if: steps.detect_rust.outputs.detected == 'yes'
        id: setup_rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt, clippy

      - name: Execute rustfmt on codebase
        if: steps.detect_rust.outputs.detected == 'yes'
        run: |
          echo "Running rustfmt..." | tee -a /tmp/signlo_diagnostics/session.log
          cargo fmt --all || echo "rustfmt encountered issues"
          COUNT=$(($(cat /tmp/signlo_diagnostics/tool_count.txt 2>/dev/null || echo 0) + 1))
          echo "$COUNT" > /tmp/signlo_diagnostics/tool_count.txt
        continue-on-error: true

      - name: Execute clippy with auto-fixes
        if: steps.detect_rust.outputs.detected == 'yes'
        run: |
          echo "Running clippy with --fix..." | tee -a /tmp/signlo_diagnostics/session.log
          cargo clippy --fix --allow-dirty --allow-staged || echo "clippy encountered issues"
          COUNT=$(($(cat /tmp/signlo_diagnostics/tool_count.txt 2>/dev/null || echo 0) + 1))
          echo "$COUNT" > /tmp/signlo_diagnostics/tool_count.txt
        continue-on-error: true

      # ===================================================================
      # GO ECOSYSTEM - gofmt & goimports
      # ===================================================================
      - name: Detect Go codebase
        id: detect_go
        run: |
          if [ -f "go.mod" ] || find . -name "*.go" -not -path "./.git/*" -not -path "./.github/*" | head -1 | grep -q .; then
            echo "detected=yes" >> "$GITHUB_OUTPUT"
            echo "Go files detected in repository" | tee -a /tmp/signlo_diagnostics/session.log
          else
            echo "detected=no" >> "$GITHUB_OUTPUT"
            echo "No Go files found - skipping Go toolchain" | tee -a /tmp/signlo_diagnostics/session.log
          fi

      - name: Setup Go runtime environment
        if: steps.detect_go.outputs.detected == 'yes'
        id: setup_go_runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: |
            **/go.sum
            **/go.mod

      - name: Install goimports tool
        if: steps.detect_go.outputs.detected == 'yes'
        id: install_goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.31.0
          echo "status=ok" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Execute gofmt on codebase
        if: steps.detect_go.outputs.detected == 'yes'
        run: |
          echo "Running gofmt..." | tee -a /tmp/signlo_diagnostics/session.log
          find . -name "*.go" -not -path "./.git/*" -not -path "./.github/*" -exec gofmt -w {} \; || echo "gofmt encountered issues"
          COUNT=$(($(cat /tmp/signlo_diagnostics/tool_count.txt 2>/dev/null || echo 0) + 1))
          echo "$COUNT" > /tmp/signlo_diagnostics/tool_count.txt
        continue-on-error: true

      - name: Execute goimports on codebase
        if: steps.detect_go.outputs.detected == 'yes' && steps.install_goimports.outputs.status == 'ok'
        run: |
          echo "Running goimports..." | tee -a /tmp/signlo_diagnostics/session.log
          find . -name "*.go" -not -path "./.git/*" -not -path "./.github/*" -exec goimports -w {} \; || echo "goimports encountered issues"
          COUNT=$(($(cat /tmp/signlo_diagnostics/tool_count.txt 2>/dev/null || echo 0) + 1))
          echo "$COUNT" > /tmp/signlo_diagnostics/tool_count.txt
        continue-on-error: true

      # ===================================================================
      # IMAGE OPTIMIZATION - PNG, JPEG, SVG
      # ===================================================================
      - name: Detect image files
        id: detect_images
        run: |
          if find . \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) \
            -not -path "./.git/*" -not -path "./.github/*" -not -path "./node_modules/*" -not -path "./vendor/*" | head -1 | grep -q .; then
            echo "detected=yes" >> "$GITHUB_OUTPUT"
            echo "Image files detected in repository" | tee -a /tmp/signlo_diagnostics/session.log
          else
            echo "detected=no" >> "$GITHUB_OUTPUT"
            echo "No image files found - skipping image optimization" | tee -a /tmp/signlo_diagnostics/session.log
          fi

      - name: Install image optimization tools
        if: steps.detect_images.outputs.detected == 'yes'
        id: install_image_tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq optipng jpegoptim
          echo "status=ok" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Optimize PNG images
        if: steps.detect_images.outputs.detected == 'yes' && steps.install_image_tools.outputs.status == 'ok'
        run: |
          echo "Optimizing PNG files..." | tee -a /tmp/signlo_diagnostics/session.log
          find . -name "*.png" -not -path "./.git/*" -not -path "./.github/*" -not -path "./node_modules/*" -not -path "./vendor/*" \
            -exec optipng -o2 -quiet {} \; || echo "optipng encountered issues"
          COUNT=$(($(cat /tmp/signlo_diagnostics/tool_count.txt 2>/dev/null || echo 0) + 1))
          echo "$COUNT" > /tmp/signlo_diagnostics/tool_count.txt
        continue-on-error: true

      - name: Optimize JPEG images
        if: steps.detect_images.outputs.detected == 'yes' && steps.install_image_tools.outputs.status == 'ok'
        run: |
          echo "Optimizing JPEG files..." | tee -a /tmp/signlo_diagnostics/session.log
          find . \( -name "*.jpg" -o -name "*.jpeg" \) -not -path "./.git/*" -not -path "./.github/*" -not -path "./node_modules/*" -not -path "./vendor/*" \
            -exec jpegoptim --strip-all --quiet {} \; || echo "jpegoptim encountered issues"
          COUNT=$(($(cat /tmp/signlo_diagnostics/tool_count.txt 2>/dev/null || echo 0) + 1))
          echo "$COUNT" > /tmp/signlo_diagnostics/tool_count.txt
        continue-on-error: true

      # SVG optimization REMOVED (2026-08-19). svgo REWRITES authored vector
      # sources (brand marks, logo kits, hand-drawn figures) which is asset
      # mutation, not formatting. On its first App-token run it minified
      # signlo-app's design/logo-kit/*.svg inside a sync PR and broke the
      # icons-lock gate (the [skip ci] era had only been hiding this).
      # Lossless PNG/JPEG optimization above is kept: it does not rewrite
      # sources anyone authors by hand.

      # ===================================================================
      # PRE-COMMIT HOOKS - If configured
      # ===================================================================
      - name: Detect pre-commit configuration
        id: detect_precommit
        run: |
          if [ -f ".pre-commit-config.yaml" ]; then
            echo "detected=yes" >> "$GITHUB_OUTPUT"
            echo "pre-commit configuration detected" | tee -a /tmp/signlo_diagnostics/session.log
          else
            echo "detected=no" >> "$GITHUB_OUTPUT"
            echo "No pre-commit config found - skipping" | tee -a /tmp/signlo_diagnostics/session.log
          fi

      - name: Install and execute pre-commit hooks
        if: steps.detect_precommit.outputs.detected == 'yes' && (steps.detect_python.outputs.detected == 'yes' || steps.setup_py_runtime.outcome == 'success') && github.event_name == 'push'
        run: |
          pip install pre-commit
          echo "Running pre-commit on all files..." | tee -a /tmp/signlo_diagnostics/session.log
          pre-commit run --all-files || echo "pre-commit encountered issues"
          COUNT=$(($(cat /tmp/signlo_diagnostics/tool_count.txt 2>/dev/null || echo 0) + 1))
          echo "$COUNT" > /tmp/signlo_diagnostics/tool_count.txt
        continue-on-error: true

      # ===================================================================
      # SAFETY CHECKPOINT - Revert any .github directory modifications
      # ===================================================================
      - name: Signlo safety checkpoint - protect .github directory
        run: |
          echo "Checking for unauthorized .github directory modifications..." | tee -a /tmp/signlo_diagnostics/session.log
          if git diff --name-only | grep -q "^\.github/"; then
            echo "⚠️ Detected modifications in .github directory - reverting for safety" | tee -a /tmp/signlo_diagnostics/session.log
            git checkout -- .github/
            echo "✅ .github directory protected and restored" | tee -a /tmp/signlo_diagnostics/session.log
          else
            echo "✅ No .github directory modifications detected" | tee -a /tmp/signlo_diagnostics/session.log
          fi

      # ===================================================================
      # REPORTING SYSTEM - Generate PR comment with diagnostics
      # ===================================================================
      - name: Build Signlo diagnostic report
        if: github.event_name == 'pull_request'
        id: build_report
        run: |
          REPORT_FILE="/tmp/signlo_diagnostics/pr_report.md"

          # Count tool executions
          TOOL_COUNT=$(cat /tmp/signlo_diagnostics/tool_count.txt 2>/dev/null || echo "0")

          {
            echo "# 🤖 Signlo Autofix Report"
            echo ""
            echo "Automated formatting and linting analysis for this pull request."
            echo ""
            echo "**Tools Executed:** $TOOL_COUNT"
            echo ""
          } > "$REPORT_FILE"

          # Check for .github issues
          if [ -s /tmp/signlo_diagnostics/github_dir_issues.txt ]; then
            {
              echo "## ⚠️ .github Directory Issues Found"
              echo ""
              echo "The following issues were detected in your \`.github/\` directory:"
              echo ""
              echo '```'
              cat /tmp/signlo_diagnostics/github_dir_issues.txt
              echo '```'
              echo ""
              echo "**Note:** These files cannot be auto-fixed by this workflow for security reasons."
              echo "Please apply fixes manually."
              echo ""
            } >> "$REPORT_FILE"
            echo "has_github_issues=yes" >> "$GITHUB_OUTPUT"
          else
            echo "has_github_issues=no" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "## ✅ Auto-Fixed Files"
            echo ""
            echo "All non-.github files have been automatically formatted and fixed."
            echo "Review the commit from \`signlo-platform-bot[bot]\` to see the changes."
          } >> "$REPORT_FILE"

          echo "Report generated at: $REPORT_FILE" | tee -a /tmp/signlo_diagnostics/session.log
        continue-on-error: true

      - name: Post diagnostic report to PR
        if: github.event_name == 'pull_request' && steps.build_report.outputs.has_github_issues == 'yes'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const reportPath = '/tmp/signlo_diagnostics/pr_report.md';
            const reportBody = fs.readFileSync(reportPath, 'utf8');

            // Search for existing Signlo Autofix comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Signlo Autofix Report')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: reportBody
              });
              console.log('Updated existing Signlo Autofix comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: reportBody
              });
              console.log('Created new Signlo Autofix comment');
            }
        continue-on-error: true

      - name: Log diagnostics for push events
        if: github.event_name == 'push'
        run: |
          echo "=== Signlo Autofix Diagnostic Summary ===" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/signlo_diagnostics/github_dir_issues.txt ]; then
            echo "⚠️ Issues found in .github directory:" | tee -a "$GITHUB_STEP_SUMMARY"
            tee -a "$GITHUB_STEP_SUMMARY" < /tmp/signlo_diagnostics/github_dir_issues.txt
          else
            echo "✅ No issues detected in .github directory" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
        continue-on-error: true

      # ===================================================================
      # COMMIT CHANGES - Only if modifications exist
      # ===================================================================
      - name: Check for formatting changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=yes" >> "$GITHUB_OUTPUT"
            echo "Formatting changes detected - will commit" | tee -a /tmp/signlo_diagnostics/session.log
          else
            echo "has_changes=no" >> "$GITHUB_OUTPUT"
            echo "No formatting changes to commit" | tee -a /tmp/signlo_diagnostics/session.log
          fi

      # The commit and push moved to the `push` job (po#8208). This job hands over a patch of
      # TRACKED files only (`git add -u` semantics, as before), with mode changes dropped, plus
      # the exact commit it formatted, so the push lands on that commit or is rejected as
      # non-fast-forward if the branch moved meanwhile.
      - name: Export the formatting patch for the push job
        id: export_patch
        if: steps.check_changes.outputs.has_changes == 'yes' && inputs.dry_run != true
        run: |
          git -c core.fileMode=false diff --binary > "$RUNNER_TEMP/autofix.patch"
          if [ -s "$RUNNER_TEMP/autofix.patch" ]; then
            echo "has_patch=yes" >> "$GITHUB_OUTPUT"
          else
            echo "has_patch=no" >> "$GITHUB_OUTPUT"
            echo "Only untracked files changed - nothing to push" | tee -a /tmp/signlo_diagnostics/session.log
          fi
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload the formatting patch
        if: steps.export_patch.outputs.has_patch == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix.patch
          retention-days: 1
          if-no-files-found: error

      - name: Report dry-run results
        if: steps.check_changes.outputs.has_changes == 'yes' && inputs.dry_run == true
        run: |
          {
            echo "## 🔍 Dry Run Mode - Changes Preview"
            echo ""
            echo "The following files would be modified:"
            echo ""
            echo '```'
            git diff --stat
            echo '```'
            echo ""
            echo "**Note:** No changes were committed because dry_run mode is enabled."
          } >> "$GITHUB_STEP_SUMMARY"

  push:
    # THE ONLY JOB THAT HOLDS A WRITE TOKEN, AND IT RUNS NO REPO CODE (2026-10-12, po#8208).
    #
    # Org deep audit 2026-10, finding SA1 second vector (docs/audits/org-audit-2026-10/
    # signlo-app.md): the formatting job ran the PR's own tree while a `contents: write` App
    # token sat in .git/config. Moving the mint to the end of the SAME job would not close
    # that, because a step that runs repo code can still reach every later step of its job:
    # it can append BASH_ENV, NODE_OPTIONS or a PATH entry to $GITHUB_ENV / $GITHUB_PATH, or
    # write core.hooksPath / core.fsmonitor into .git/config, and the push step would then run
    # attacker code with the token in its environment. A second job starts from a fresh
    # checkout, a fresh environment and a fresh .git/config, so the only thing crossing the
    # boundary is the patch and the sha it applies to. The patch is DATA, validated below before
    # anything is minted; the sha is checked against the LIVE tip of the branch being pushed
    # (checked out by name here), so a formatting job that lies about it is refused rather than
    # trusted to pick which commit the bot pushes.
    #
    # The App token (not GITHUB_TOKEN) is still what pushes: GITHUB_TOKEN pushes do not
    # trigger workflows, so the required CI/Test checks would never run on the format commit
    # and auto-merge would stay blocked.
    #
    # Same runner expression as `autofix`, so a repo's AUTOFIX_RUNNER choice decides both and
    # this job adds no hosted minutes to a repo that opted onto the fleet. It runs only when
    # there is a patch to push. Residual, stated rather than hidden: on a persistent SELF-HOSTED
    # runner a previous job can leave files outside the workspace (a ~/.gitconfig hook that the
    # checkout action below would run, for one), which no job layout can rule out; that is the
    # general self-hosted trust question, not this file's. GIT_CONFIG_GLOBAL=/dev/null and
    # GIT_CONFIG_NOSYSTEM=1 in the two `run:` steps narrow it for the apply, commit and push,
    # and are deliberately not job-level, because actions/checkout writes `--global` config.
    needs: autofix
    # The actor clause repeats the autofix job's Dependabot exclusion: `needs:` already skips this
    # job whenever that one is skipped, but scripts/check_dependabot_secret_scope.py grades each
    # job that consumes the App secrets on its OWN `if:`, and so should a reader.
    if: github.actor != 'dependabot[bot]' && needs.autofix.outputs.has_patch == 'yes'
    runs-on: ${{ vars.FLEET_RUNNER_MODE != 'hosted' && vars.AUTOFIX_RUNNER == 'self-hosted' && contains('|Signlo/.github|Signlo/claude-config|Signlo/deaflare-app|Signlo/deaflare-web|Signlo/diplosint|Signlo/hearcompanion-app|Signlo/ideafe-web|Signlo/iptorian|Signlo/signlo-admin|Signlo/signlo-app|Signlo/signlo-brand|Signlo/signlo-codec|Signlo/signlo-platform-ops|Signlo/signlo-studio|Signlo/signlo-web|', format('|{0}|', github.repository)) && fromJSON('["self-hosted","fleet-x64"]') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref_name }}
          persist-credentials: false
          # Bounded history for the moved-branch test in the validate step: the formatted
          # commit must be found among the last 50 commits of the branch. Anything older,
          # missing or unrelated stays a refusal (a failed run), never a pass.
          fetch-depth: 50

      - name: Download the formatting patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix-patch

      # The patch was produced by a job that ran untrusted code, so it is checked as data:
      # in-place edits of tracked files only (no create, delete, rename, mode, symlink or
      # submodule change), nothing under .github/ (the safety checkpoint's invariant, re-enforced here
      # because the job that enforced it is the one being distrusted), and applied onto the
      # exact commit that job formatted. Staged here; no token exists yet in this job.
      #
      # A BRANCH THAT MOVED IS NOT A FAILED BUILD (2026-10-20, alert-noise-1020). On a busy main a
      # merge lands between the formatting job and this one, the live tip is no longer the
      # formatted commit, and the refusal used to exit 1: four repos paged `main-build-failure`
      # critical in one morning for a run that had correctly declined to push. So the refusal
      # now has two outcomes. The formatted sha is an ANCESTOR of the live tip (within the 50
      # commits fetched above): the branch moved, nothing is applied or pushed, the step ends
      # green with a notice and writes `base=moved`, and the next push to the branch formats
      # again. Anything else (a sha not in the fetched history, not an ancestor, or a git
      # error) is a forged or unknown sha and stays a FAILED run, which still pages. Only
      # `base=current` lets the mint and the push run.
      - name: Validate and stage the formatting patch
        id: validate
        env:
          PATCH_FILE: ${{ runner.temp }}/autofix-patch/autofix.patch
          EXPECTED_SHA: ${{ needs.autofix.outputs.base_sha }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          if ! printf '%s' "$EXPECTED_SHA" | grep >/dev/null -E '^[0-9a-f]{40}$'; then
            echo "refusing: the formatted commit is not a 40-hex sha"
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          if [ "$head_sha" != "$EXPECTED_SHA" ]; then
            # Ancestry, not equality: `cat-file -e` and `merge-base --is-ancestor` both return
            # non-zero for a sha absent from the fetched history, and is-ancestor returns 1 for
            # a commit that is present but off this branch, so every unknown case lands below.
            if git cat-file -e "${EXPECTED_SHA}^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$EXPECTED_SHA" "$head_sha"; then
              echo "::notice::branch moved: the formatted commit ${EXPECTED_SHA} is an ancestor of the live tip ${head_sha}, nothing pushed; the next push to this branch formats again"
              echo "base=moved" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "refusing: the checkout ${head_sha} is not the commit the autofix job formatted (${EXPECTED_SHA}) nor a descendant of it within the fetched history (a forged or unknown sha)"
            exit 1
          fi
          summary="$(git apply --summary "$PATCH_FILE")"
          if [ -n "$summary" ]; then
            echo "refusing: the patch creates, deletes, renames or re-modes a file:"
            printf '%s\n' "$summary"
            exit 1
          fi
          paths="$(git apply --numstat -z "$PATCH_FILE" | tr '\0' '\n' | cut -f3-)"
          if [ -z "$paths" ]; then
            echo "refusing: the patch changes no file"
            exit 1
          fi
          if printf '%s\n' "$paths" | grep -E '^\.github/'; then
            echo "refusing: the patch touches .github/, which autofix never commits"
            exit 1
          fi
          git -c core.hooksPath=/dev/null apply --index "$PATCH_FILE"
          # Judged on what was STAGED, not on the patch text: `git apply` takes a file's mode
          # from the index when the patch has no `index` line, so a text check is bypassable.
          # Every entry must be a regular file before and after, modified in place, with its mode
          # unchanged: a lone `new mode 100755` header prints nothing under `--summary` (it
          # reports a mode change only when the patch carries both modes) and `git apply` still
          # stages the flip, so the old and new modes are compared here, on what was staged.
          bad="$(git diff --cached --raw --no-renames | awk '$1 !~ /^:100(644|755)$/ || $2 !~ /^100(644|755)$/ || substr($1, 2) != $2 || $5 != "M"')"
          if [ -n "$bad" ]; then
            echo "refusing: the patch changes a symlink, a submodule, a file mode or a non-regular entry:"
            printf '%s\n' "$bad"
            git reset -q --hard HEAD
            exit 1
          fi
          git diff --cached --stat
          echo "base=current" >> "$GITHUB_OUTPUT"

      # Minted only now, after the last step that reads anything the PR supplied, and only when
      # the validate step confirmed the live tip IS the formatted commit (`base=moved` skips it).
      - name: Mint GitHub App token
        id: app-token
        if: steps.validate.outputs.base == 'current'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SIGNLO_BOT_APP_ID }}
          private-key: ${{ secrets.SIGNLO_BOT_PRIVATE_KEY }}
          # Scope, 2026-09-17 (#6416). NO `owner:` and NO `repositories:`, deliberately and
          # unchanged: with both unset the action scopes the token to the RUNNING repository,
          # which is what this needs, and this file is distributed verbatim into every Signlo
          # repo by scripts/sync_autofix.py, so any literal repository name here would ship to
          # all of them and be wrong in every one but this.
          # This token has exactly ONE consumer, the push in the next step, which is
          # contents: write. The PR comment runs in the `autofix` job on github.token.
          # `workflows: write` is deliberately NOT here: the step above refuses any patch
          # under `.github/`, so no workflow file can ever enter the push.
          # Worth knowing before trimming this further: the push step carries
          # `continue-on-error: true`, so a 403 there is a GREEN run that pushed nothing.
          permission-contents: write

      # The token reaches git through GIT_CONFIG_* environment entries for this one command:
      # never .git/config, never argv (where `ps` on a self-hosted box would show it).
      - name: Commit and push formatting changes
        if: steps.validate.outputs.base == 'current'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          TARGET_BRANCH: ${{ inputs.ref || github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          # No [skip ci]: pushed via the App token, this commit re-triggers the
          # required CI/Test checks so auto-merge can complete (formatting is
          # idempotent, so the re-run finds nothing to commit, so no loop).
          git -c core.hooksPath=/dev/null -c user.name="${APP_SLUG}[bot]" \
            -c user.email="${APP_SLUG}[bot]@users.noreply.github.com" \
            commit --no-verify -q -m "style: apply automated formatting fixes"
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
            git -c core.hooksPath=/dev/null push origin HEAD:"${TARGET_BRANCH}"
        continue-on-error: true
